<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS Home galaxy</title>
  <style>
    :root {
      --void: #000000;
      --star: #F4EFE2;
      --muted: #8A8A96;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--star);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage, #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: var(--star);
    }
    #fallback[hidden] { display: none; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.18), transparent 28%, transparent 72%, rgba(0,0,0,0.22));
    }
    #overlay.show {
      pointer-events: auto;
    }
    #overlay.from-bottom { transform: translate3d(0, 36vh, 0); }
    #overlay.from-top { transform: translate3d(0, -36vh, 0); }
    #overlay.show.ready {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
    #overlay.motion {
      transition: opacity 0.72s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.78s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #track {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: min(560px, 72vw);
      will-change: transform;
    }
    #track.motion {
      transition: transform 0.62s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 8px;
      border: 0;
      background: transparent;
      color: var(--star);
      font: inherit;
      text-align: left;
      opacity: 0.22;
      transform: scale(0.96);
      text-shadow: 0 2px 18px #000;
    }
    .row.motion {
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row.focus {
      opacity: 0.96;
      transform: scale(1.04);
    }
    .row .title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .row .meta {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .preview-caption {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px #000;
    }
    body.preview .preview-caption { display: block; }
    .preview-caption h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .preview-caption p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="fallback" hidden>Galaxy needs WebGL.</div>
    <div id="overlay">
      <div id="track"></div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Games</h1>
    <p id="previewHint">Left/Right shift nodes · Up/Down open this list</p>
  </div>
  <script src="three.min.js"></script>
  <script src="cube-scene.js"></script>
</body>
</html>
