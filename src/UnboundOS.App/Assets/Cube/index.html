<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS Home galaxy</title>
  <style>
    :root {
      --void: #000000;
      --star: #F4F1EA;
      --muted: #8A8A96;
      --veil: rgba(4, 6, 12, 0.18);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--star);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage, #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: var(--star);
    }
    #fallback[hidden] { display: none; }
    #overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12%;
      height: 168px;
      display: none;
      align-items: center;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, var(--veil) 40%, transparent);
    }
    #overlay.show { display: flex; }
    #track {
      display: flex;
      gap: 18px;
      padding: 0 12vw;
      will-change: transform;
    }
    .game-card {
      flex: 0 0 220px;
      height: 124px;
      border: 1px solid rgba(244, 241, 234, 0.16);
      background: rgba(8, 10, 16, 0.28);
      backdrop-filter: blur(10px);
      color: var(--star);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 18px;
      box-sizing: border-box;
      opacity: 0.42;
      transform: scale(0.92);
      transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.35s ease;
    }
    .game-card.focus {
      opacity: 0.92;
      transform: scale(1.04);
      border-color: rgba(244, 241, 234, 0.45);
      background: rgba(12, 14, 22, 0.36);
    }
    .game-card .meta {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .game-card .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .game-card .mark {
      font-size: 28px;
      font-weight: 650;
      opacity: 0.8;
    }
    .preview-caption {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px #000;
    }
    body.preview .preview-caption { display: block; }
    .preview-caption h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .preview-caption p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="fallback" hidden>Galaxy needs WebGL.</div>
    <div id="overlay">
      <div id="track"></div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Games</h1>
    <p id="previewHint">Up opens games · Down opens Settings · Left/Right shift nodes</p>
  </div>
  <script src="three.min.js"></script>
  <script src="cube-scene.js"></script>
</body>
</html>
