<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS Home</title>
  <style>
    /* A font by Jos Buivenga (exljbris) -> www.exljbris.com */
    @font-face {
      font-family: "Diavlo Book";
      src: url("../Fonts/Diavlo_BOOK_II_37.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Diavlo Medium";
      src: url("../Fonts/Diavlo_MEDIUM_II_37.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Diavlo Bold";
      src: url("../Fonts/Diavlo_BOLD_II_37.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --void: #05070A;
      --star: #F4EFE2;
      --muted: #8A8A96;
      --cyan: #00F0FF;
      --list-font: "Diavlo Book", "Diavlo Medium", "Diavlo Bold", "Segoe UI Variable", "Segoe UI", sans-serif;
      --blade-w: 15px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--star);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color-scheme: dark;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #05070A;
    }
    #studio {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20vh;
      background: radial-gradient(ellipse 50% 100% at 50% 100%,
        #0a0d12 0%,
        #05070A 100%);
    }
    #tabRow {
      position: absolute;
      left: 50%;
      bottom: 5.5vh;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      width: min(880px, 68vw);
      height: clamp(300px, 48vh, 620px);
      pointer-events: auto;
    }
    .tab {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .blade {
      position: relative;
      width: var(--blade-w);
      height: 100%;
      border-radius: 1.5px 1.5px 0 0;
      background:
        linear-gradient(90deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.05) 16%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.28) 100%),
        linear-gradient(180deg,
          #8a94a0 0%,
          #5a636e 35%,
          #454d56 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.045),
        inset 1px 0 0 rgba(255, 255, 255, 0.16),
        inset -1px 0 0 rgba(0, 0, 0, 0.3),
        22px 14px 48px rgba(0, 0, 0, 0.48);
    }
    .tab.is-focus .blade {
      background:
        linear-gradient(90deg,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(255, 255, 255, 0.07) 16%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.24) 100%),
        linear-gradient(180deg,
          #9aa4b0 0%,
          #6a7380 35%,
          #545c66 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 1px 0 0 rgba(255, 255, 255, 0.2),
        inset -1px 0 0 rgba(0, 0, 0, 0.28),
        26px 18px 56px rgba(0, 0, 0, 0.52);
      transform: translateY(-16px);
    }
    .tip {
      position: absolute;
      top: 0;
      left: -1px;
      right: -1px;
      height: 8px;
      border-radius: 1.5px 1.5px 0 0;
      background: linear-gradient(180deg, #9cffff 0%, #00F0FF 42%, #00c4d4 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
    }
    .tab.is-focus .tip {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 0 10px rgba(0, 240, 255, 0.22);
    }
    .tab-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 16px);
      transform: translateX(-50%);
      margin: 0;
      color: #F4F7FA;
      font-family: "Diavlo Medium", var(--list-font);
      font-weight: 500;
      font-size: clamp(26px, 2.2vw, 36px);
      letter-spacing: 0.04em;
      line-height: 1.1;
      white-space: nowrap;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0, "swsh" 0, "dlig" 0, "ss01" 0;
      text-shadow: 0 6px 22px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
    }
    .tab.is-focus .tab-label { opacity: 1; }
    #studio.is-overlay .tab-label { opacity: 0; }
    #studio.is-overlay .tab:not(.is-focus) { opacity: 0.42; }
    body:not(.reduce-motion) .blade,
    body:not(.reduce-motion) .tab-label,
    body:not(.reduce-motion) .tab {
      transition:
        transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.42s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
    }
    #scrim {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 46%;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-10%, 0, 0);
      background:
        linear-gradient(90deg,
          rgba(0, 0, 0, 0.46) 0%,
          rgba(0, 0, 0, 0.36) 38%,
          rgba(0, 0, 0, 0.16) 72%,
          rgba(0, 0, 0, 0) 100%);
    }
    #overlay.ready #scrim {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
    #overlay.motion #scrim {
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.78s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #listPane {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(460px, 44%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 2.4vw 0 6.4vw;
      box-sizing: border-box;
      opacity: 0;
      transform: translate3d(-14px, 0, 0);
    }
    #overlay.show #listPane { pointer-events: auto; }
    #overlay.ready #listPane {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
    #overlay.motion #listPane {
      transition: opacity 0.64s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #listHead {
      margin: 0 0 18px;
      font-family: var(--list-font);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #track {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: min(440px, 100%);
      will-change: transform;
      transform: translate3d(0, var(--track-y, 0px), 0);
    }
    #overlay.motion #track {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row {
      display: block;
      width: 100%;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: var(--star);
      font-family: var(--list-font);
      font-weight: 400;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-align: left;
      cursor: pointer;
      opacity: 0.4;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.8);
    }
    .row.motion {
      transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row.focus {
      opacity: 1;
      font-weight: 700;
      color: var(--cyan);
      text-shadow:
        0 0 18px rgba(0, 240, 255, 0.28),
        0 1px 14px rgba(0, 0, 0, 0.85);
    }
    .row .title { display: block; }
    .preview-caption { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="studio">
      <div id="floor" aria-hidden="true"></div>
      <div id="tabRow" role="tablist" aria-label="Home"></div>
    </div>
    <div id="overlay">
      <div id="scrim" aria-hidden="true"></div>
      <div id="listPane">
        <p id="listHead"></p>
        <div id="track"></div>
      </div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Games</h1>
    <p id="previewHint">Left/Right move tabs · Up/Down open this list</p>
  </div>
  <script src="cube-scene.js"></script>
</body>
</html>
