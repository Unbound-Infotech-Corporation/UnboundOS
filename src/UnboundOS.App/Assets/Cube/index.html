<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS navigation cube</title>
  <style>
    :root {
      --cavity: #080605;
      --bone: #C8B49A;
      --bile: #C4A46A;
      --vein: #6FA896;
      --ash: #1A1612;
      --muted: #8A7A68;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--cavity);
      color: var(--bone);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body.preview {
      background:
        radial-gradient(900px 420px at 48% 38%, rgba(196, 138, 60, 0.1), transparent 55%),
        radial-gradient(1400px 800px at 50% 110%, #120e0c, var(--cavity));
    }
    #stage, #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 980px;
    }
    #fallback[hidden] { display: none; }
      .css-cube {
      width: 176px;
      height: 176px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-17deg) rotateY(28deg);
    }
    .css-face {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(138, 122, 98, 0.55);
      background:
        radial-gradient(circle at 50% 42%, rgba(18, 12, 10, 0.55), transparent 42%),
        linear-gradient(180deg, rgba(200, 180, 154, 0.16), rgba(26, 22, 18, 0.9)),
        #2A241C;
      color: var(--bone);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      box-sizing: border-box;
    }
    .css-face strong { font-size: 48px; font-weight: 650; letter-spacing: -0.04em; }
    .css-face span { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }
    .css-face b { font-size: 15px; font-weight: 600; }
    .f-session { transform: translateZ(88px); }
    .f-tools { transform: rotateY(90deg) translateZ(88px); }
    .f-hardware { transform: rotateY(180deg) translateZ(88px); }
    .f-network { transform: rotateY(-90deg) translateZ(88px); }
    .f-mods { transform: rotateX(90deg) translateZ(88px); }
    .f-files { transform: rotateX(-90deg) translateZ(88px); }
    .preview-caption {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px #080605;
    }
    body.preview .preview-caption { display: block; }
    .preview-caption h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      color: var(--bone);
    }
    .preview-caption p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="fallback" hidden>
      <div class="css-cube" aria-hidden="true">
        <div class="css-face f-session"><span>SYS</span><strong>S</strong><b>Session</b></div>
        <div class="css-face f-tools"><span>KIT</span><strong>T</strong><b>Tools</b></div>
        <div class="css-face f-hardware"><span>HW</span><strong>H</strong><b>Hardware</b></div>
        <div class="css-face f-network"><span>LINK</span><strong>N</strong><b>Network</b></div>
        <div class="css-face f-mods"><span>MOD</span><strong>M</strong><b>Mods</b></div>
        <div class="css-face f-files"><span>FS</span><strong>F</strong><b>Files</b></div>
      </div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Session</h1>
    <p id="previewHint">Arrow keys rotate · Enter opens · drag or click a plate</p>
  </div>
  <script src="three.min.js"></script>
  <script src="cube-scene.js"></script>
</body>
</html>
