<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS Home</title>
  <style>
    /* A font by Jos Buivenga (exljbris) -> www.exljbris.com */
    @font-face {
      font-family: "Diavlo Book";
      src: url("../Fonts/Diavlo_BOOK_II_37.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Diavlo Medium";
      src: url("../Fonts/Diavlo_MEDIUM_II_37.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Diavlo Bold";
      src: url("../Fonts/Diavlo_BOLD_II_37.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    /* Theme tokens — Super Clean Home. Keep UnboundTokens.cs in sync. */
    :root {
      --void: #05070A;
      --paper: #F7FAFC;
      --quiet: #5C646C;
      --cyan: #00F0FF;
      --list-font: "Diavlo Book", "Diavlo Medium", "Diavlo Bold", "Segoe UI Variable", "Segoe UI", sans-serif;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--paper);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color-scheme: dark;
    }
    #stage {
      position: absolute;
      inset: 0;
      background: #05070A;
    }
    #labelStack {
      position: absolute;
      left: clamp(40px, 7vw, 110px);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-height: 86vh;
      z-index: 3;
    }
    .label {
      --d: 3;
      position: relative;
      display: block;
      margin: 0;
      padding: calc(4px + (2.2 - min(var(--d), 2.2)) * 14px) 0 calc(4px + (2.2 - min(var(--d), 2.2)) * 14px) 18px;
      border: 0;
      background: transparent;
      color: var(--quiet);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: clamp(16px, 1.35vw + (2 - min(var(--d), 2)) * 0.28vw, 22px);
      font-weight: 400;
      letter-spacing: 0.18em;
      line-height: 1.05;
      text-align: left;
      cursor: pointer;
      opacity: calc(0.34 + (1 - min(var(--d), 3) / 3) * 0.4);
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0, "swsh" 0;
    }
    .label.is-focus {
      color: var(--paper);
      font-family: "Diavlo Medium", var(--list-font);
      font-size: clamp(52px, 6.6vw, 96px);
      letter-spacing: 0.05em;
      opacity: 1;
      padding-top: 18px;
      padding-bottom: 18px;
    }
    .label.is-focus::before {
      content: "";
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 2px;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    }
    body:not(.reduce-motion) .label {
      transition:
        font-size 0.48s cubic-bezier(0.16, 1, 0.3, 1),
        padding 0.48s cubic-bezier(0.16, 1, 0.3, 1),
        color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        letter-spacing 0.48s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.is-overlay #labelStack { visibility: hidden; pointer-events: none; }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: block;
      pointer-events: none;
      background: #05070A;
      opacity: 0;
    }
    #overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    body:not(.reduce-motion) #overlay {
      transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #listPane {
      position: absolute;
      left: clamp(40px, 7vw, 110px);
      top: 0;
      bottom: 0;
      width: min(720px, 78vw);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vh 0;
      box-sizing: border-box;
    }
    #listHead {
      margin: 0 0 28px;
      font-family: var(--list-font);
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #7A828A;
    }
    #track {
      display: flex;
      flex-direction: column;
      gap: 4px;
      will-change: transform;
      transform: translate3d(0, var(--track-y, 0px), 0);
    }
    #overlay.motion #track {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row {
      display: block;
      width: 100%;
      padding: 14px 0;
      border: 0;
      background: transparent;
      color: var(--paper);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: clamp(26px, 2.4vw, 36px);
      line-height: 1.15;
      letter-spacing: 0.02em;
      text-align: left;
      cursor: pointer;
      opacity: 0.38;
    }
    .row.motion {
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row.focus {
      opacity: 1;
      font-family: "Diavlo Medium", var(--list-font);
      color: var(--cyan);
    }
    .preview-caption { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="studio">
      <div id="labelStack" role="listbox" aria-label="Home"></div>
    </div>
    <div id="overlay">
      <div id="listPane">
        <p id="listHead"></p>
        <div id="track"></div>
      </div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Games</h1>
    <p id="previewHint">Up/Down move labels · Enter opens this group</p>
  </div>
  <script src="cube-scene.js"></script>
</body>
</html>
