<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS Home galaxy</title>
  <style>
    /* A font by Jos Buivenga (exljbris) -> www.exljbris.com */
    @font-face {
      font-family: "Diavlo";
      src: url("../Fonts/Diavlo_BOOK_II_37.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Diavlo";
      src: url("../Fonts/Diavlo_MEDIUM_II_37.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Diavlo";
      src: url("../Fonts/Diavlo_BOLD_II_37.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --void: #000000;
      --star: #F4EFE2;
      --muted: #8A8A96;
      --cyan: #00F0FF;
      --list-font: "Diavlo", "Segoe UI Variable", "Segoe UI", sans-serif;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--star);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage, #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: var(--star);
    }
    #fallback[hidden] { display: none; }
    #overlay {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
    }
    #scrim {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 46%;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-10%, 0, 0);
      background:
        linear-gradient(90deg,
          rgba(0, 0, 0, 0.46) 0%,
          rgba(0, 0, 0, 0.36) 38%,
          rgba(0, 0, 0, 0.16) 72%,
          rgba(0, 0, 0, 0) 100%);
    }
    #overlay.ready #scrim {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
    #overlay.motion #scrim {
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.78s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #listPane {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(460px, 44%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 2.4vw 0 6.4vw;
      box-sizing: border-box;
      opacity: 0;
      transform: translate3d(-14px, 0, 0);
    }
    #overlay.show #listPane { pointer-events: auto; }
    #overlay.ready #listPane {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
    #overlay.motion #listPane {
      transition: opacity 0.64s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #listHead {
      margin: 0 0 18px;
      font-family: var(--list-font);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #track {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: min(440px, 100%);
      will-change: transform;
      transform: translate3d(0, var(--track-y, 0px), 0);
    }
    #overlay.motion #track {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row {
      display: block;
      width: 100%;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: var(--star);
      font-family: var(--list-font);
      font-weight: 400;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-align: left;
      cursor: pointer;
      opacity: 0.4;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.8);
    }
    .row.motion {
      transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row.focus {
      opacity: 1;
      font-weight: 700;
      color: var(--cyan);
      text-shadow:
        0 0 18px rgba(0, 240, 255, 0.28),
        0 1px 14px rgba(0, 0, 0, 0.85);
    }
    .row .title { display: block; }
    #nodeLabel {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      margin: 0;
      padding: 0;
      pointer-events: none;
      font-family: var(--list-font);
      font-weight: 500;
      color: #F6F1E4;
      font-size: clamp(30px, 3.6vw, 44px);
      letter-spacing: 0.04em;
      line-height: 1.1;
      white-space: nowrap;
      text-shadow:
        0 0 3px #000,
        0 1px 0 #000,
        0 2px 10px rgba(0, 0, 0, 0.9),
        0 10px 28px rgba(0, 0, 0, 0.55);
    }
    #nodeLabel[hidden] { display: none; }
    .preview-caption {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px #000;
    }
    body.preview .preview-caption { display: block; }
    .preview-caption h1 {
      margin: 0;
      font-family: var(--list-font);
      font-size: 20px;
      font-weight: 500;
    }
    .preview-caption p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="nodeLabel" hidden aria-live="polite"></div>
    <div id="fallback" hidden>Galaxy needs WebGL.</div>
    <div id="overlay">
      <div id="scrim" aria-hidden="true"></div>
      <div id="listPane">
        <p id="listHead"></p>
        <div id="track"></div>
      </div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Games</h1>
    <p id="previewHint">Left/Right shift nodes · Up/Down open this list</p>
  </div>
  <script src="three.min.js"></script>
  <script src="cube-scene.js"></script>
</body>
</html>
