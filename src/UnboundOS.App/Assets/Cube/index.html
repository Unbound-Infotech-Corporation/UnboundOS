<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS navigation cube</title>
  <style>
    :root {
      --obsidian: #05070A;
      --steel: #0B121D;
      --cyan: #00F0FF;
      --cobalt: #1E40AF;
      --paper: #F8FAFC;
      --muted: #94A3B8;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--obsidian);
      color: var(--paper);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body.preview {
      background:
        radial-gradient(1200px 500px at 50% -10%, rgba(30, 64, 175, 0.18), transparent 60%),
        linear-gradient(180deg, #05070A 0%, #070B12 55%, #05070A 100%);
    }
    #stage, #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 980px;
    }
    #fallback[hidden] { display: none; }
    .css-cube {
      width: 240px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-17deg) rotateY(28deg);
    }
    .css-face {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 240, 255, 0.35);
      background:
        linear-gradient(180deg, rgba(0, 240, 255, 0.08), transparent 40%),
        linear-gradient(90deg, rgba(11, 18, 29, 0.2), transparent),
        #0B121D;
      color: var(--paper);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      box-sizing: border-box;
    }
    .css-face strong { font-size: 64px; font-weight: 650; letter-spacing: -0.04em; }
    .css-face span { font-size: 11px; letter-spacing: 0.22em; color: var(--cyan); text-transform: uppercase; }
    .css-face b { font-size: 15px; font-weight: 600; }
    .f-session { transform: translateZ(120px); }
    .f-tools { transform: rotateY(90deg) translateZ(120px); }
    .f-hardware { transform: rotateY(180deg) translateZ(120px); }
    .f-network { transform: rotateY(-90deg) translateZ(120px); }
    .f-mods { transform: rotateX(90deg) translateZ(120px); }
    .f-files { transform: rotateX(-90deg) translateZ(120px); }
    .preview-caption {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px #05070A;
    }
    body.preview .preview-caption { display: block; }
    .preview-caption h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    .preview-caption p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="fallback" hidden>
      <div class="css-cube" aria-hidden="true">
        <div class="css-face f-session"><span>SYS</span><strong>S</strong><b>Session</b></div>
        <div class="css-face f-tools"><span>KIT</span><strong>T</strong><b>Tools</b></div>
        <div class="css-face f-hardware"><span>HW</span><strong>H</strong><b>Hardware</b></div>
        <div class="css-face f-network"><span>LINK</span><strong>N</strong><b>Network</b></div>
        <div class="css-face f-mods"><span>MOD</span><strong>M</strong><b>Mods</b></div>
        <div class="css-face f-files"><span>FS</span><strong>F</strong><b>Files</b></div>
      </div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Session</h1>
    <p id="previewHint">Arrow keys rotate · Enter opens · drag or click a plate</p>
  </div>
  <script src="three.min.js"></script>
  <script src="cube-scene.js"></script>
</body>
</html>
