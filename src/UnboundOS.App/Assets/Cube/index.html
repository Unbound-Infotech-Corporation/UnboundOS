<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnboundOS Home galaxy</title>
  <style>
    :root {
      --void: #000000;
      --star: #F4EFE2;
      --muted: #8A8A96;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--star);
      font-family: "Segoe UI Variable", "Segoe UI", Inter, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage, #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: var(--star);
    }
    #fallback[hidden] { display: none; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
    }
    #overlay.show { pointer-events: auto; }
    #scrim {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 46%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, rgba(0, 2, 8, 0.64) 0%, rgba(0, 2, 8, 0.36) 58%, rgba(0, 2, 8, 0) 100%);
    }
    #overlay.show.ready #scrim { opacity: 1; }
    #overlay.motion #scrim {
      transition: opacity 0.68s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #track {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: min(400px, 36vw);
      margin-left: 7vw;
      will-change: transform;
      opacity: 0;
    }
    #track.from-bottom { transform: translate3d(0, 34vh, 0); }
    #track.from-top { transform: translate3d(0, -34vh, 0); }
    #overlay.show.ready #track {
      opacity: 1;
      transform: translate3d(0, var(--track-y, 0px), 0);
    }
    #overlay.motion #track {
      transition: opacity 0.72s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.78s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 4px;
      border: 0;
      background: transparent;
      color: var(--star);
      font: inherit;
      text-align: left;
      opacity: 0.28;
      transform: scale(0.97);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85);
    }
    .row.motion {
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row.focus {
      opacity: 0.96;
      transform: scale(1.03);
    }
    .row .title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .row .meta {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .preview-caption {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px #000;
    }
    body.preview .preview-caption { display: block; }
    .preview-caption h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .preview-caption p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="fallback" hidden>Galaxy needs WebGL.</div>
    <div id="overlay">
      <div id="scrim" aria-hidden="true"></div>
      <div id="track"></div>
    </div>
  </div>
  <div class="preview-caption">
    <h1 id="previewTitle">Games</h1>
    <p id="previewHint">Left/Right shift nodes · Up/Down open this list</p>
  </div>
  <script src="three.min.js"></script>
  <script src="cube-scene.js"></script>
</body>
</html>
